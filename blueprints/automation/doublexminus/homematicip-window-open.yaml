blueprint:
  name: "CCU3 Fenster-Modus für HmIP-eTRV-B (Address-Fix)"
  description: "Aktiviert/deaktiviert den internen WINDOW_STATE von mehreren HmIP-eTRV-B Thermostaten über die CCU3, indem das Suffix (:1) aus der Adresse gefiltert wird."
  source_url: https://githubusercontent.com
  domain: automation
  input:
    window_sensor:
      name: "Fenster- oder Türsensor"
      description: "Wählen Sie den Aqara Zigbee Kontaktsensor aus."
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: window
            - domain: binary_sensor
              device_class: door
    thermostats:
      name: "Thermostate"
      description: "Wählen Sie ein oder mehrere HmIP-eTRV-B Heizkörperthermostate aus."
      selector:
        entity:
          filter:
            - domain: climate
          multiple: true
    open_delay:
      name: "Verzögerung beim Öffnen (Wartezeit)"
      description: "Das Fenster muss mindestens so viele Sekunden offen sein, bevor die CCU3 benachrichtigt wird."
      default: 0
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: "Sekunden"
          mode: slider

mode: restart

trigger:
  - platform: state
    entity_id: !input window_sensor
    from: "off"
    to: "on"
    id: fenster_offen
  - platform: state
    entity_id: !input window_sensor
    from: "on"
    to: "off"
    id: fenster_zu
    for:
      seconds: 5

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: fenster_offen
        sequence:
          # Wartet die konfigurierte Zeit ab (z. B. beim Stoßlüften)
          - delay:
              seconds: !input open_delay
          # Schleife schneidet das ':1' Suffix ab und sendet '1' an die CCU3
          - repeat:
              for_each: !input thermostats
              sequence:
                - service: homematicip_local.set_device_value
                  data:
                    device_address: "{{ state_attr(repeat.item, 'address').split(':')[0] }}"
                    channel: 1
                    parameter: WINDOW_STATE
                    value: 1

      - conditions:
          - condition: trigger
            id: fenster_zu
        sequence:
          # Schleife schneidet das ':1' Suffix ab und sendet '0' an die CCU3
          - repeat:
              for_each: !input thermostats
              sequence:
                - service: homematicip_local.set_device_value
                  data:
                    device_address: "{{ state_attr(repeat.item, 'address').split(':')[0] }}"
                    channel: 1
                    parameter: WINDOW_STATE
                    value: 0
