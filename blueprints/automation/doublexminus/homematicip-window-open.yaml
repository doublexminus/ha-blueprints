blueprint:
  name: "HmIP Fenster-Erkennung"
  description: "Setzt den WINDOW_STATE am HmIP-eTRV-B über die CCU3 auf 1 (offen) bzw. 0 (geschlossen), sobald der zugeordnete Kontaktsensor seinen Zustand ändert. Verhindert unnötiges Heizen bei geöffnetem Fenster."
  source_url: https://raw.githubusercontent.com/doublexminus/ha-blueprints/refs/heads/main/blueprints/automation/doublexminus/homematicip-window-open.yaml
  domain: automation
  input:
    window_sensor:
      name: "Fenster- oder Türsensor"
      description: "Wählen Sie den Aqara Zigbee Kontaktsensor aus."
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: window
            - domain: binary_sensor
              device_class: door
    thermostat:
      name: "Thermostat"
      description: "Wählen Sie das einzelne HmIP-eTRV-B Heizkörperthermostat aus."
      selector:
        entity:
          filter:
            - domain: climate
          multiple: false
    open_delay:
      name: "Verzögerung beim Öffnen (Wartezeit)"
      description: "Das Fenster muss mindestens so viele Sekunden offen sein, bevor die CCU3 benachrichtigt wird."
      default: 0
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: "Sekunden"
          mode: slider

# WICHTIG: Hier wird das !input in eine nutzbare Jinja-Variable übersetzt
variables:
  target_thermostat: !input thermostat 

mode: restart

trigger:
  - platform: state
    entity_id: !input window_sensor
    from: "off"
    to: "on"
    id: fenster_offen
  - platform: state
    entity_id: !input window_sensor
    from: "on"
    to: "off"
    id: fenster_zu
    for:
      seconds: 5     

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: fenster_offen
        sequence:
          # Wartet die konfigurierte Zeit ab (z. B. beim Stoßlüften)
          - delay:
              seconds: !input open_delay
          # Sendet direkt an das ausgewählte Thermostat (ohne Schleife)
          - service: homematicip_local.set_device_value
            data:
              device_address: "{{ (state_attr(target_thermostat, 'address') or '').split(':')[0] }}"
              channel: 1
              parameter: WINDOW_STATE
              value: 1

      - conditions:
          - condition: trigger
            id: fenster_zu
        sequence:
          # Schließt das Fenster auf der CCU3 wieder
          - service: homematicip_local.set_device_value
            data:
              device_address: "{{ (state_attr(target_thermostat, 'address') or '').split(':')[0] }}"
              channel: 1
              parameter: WINDOW_STATE
              value: 0
