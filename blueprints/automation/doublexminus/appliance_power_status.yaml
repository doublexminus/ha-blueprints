blueprint:
  name: "Geräte-Leistungs-Status (mit Timer)"
  description: "Erstellt automatisch Status-Sensor für Geräte basierend auf Leistungsaufnahme. Nutzt Schwellwerte und Timer-Verzögerung für zuverlässige Statuserkennung auch bei Pausen während des Betriebs."
  domain: automation
  homeassistant:
    min_version: "2024.1.0"
  
  input:
    device_name:
      name: "Geräte-Name"
      description: "Z.B. 'Waschmaschine', 'Trockner', 'Spülmaschine'"
      selector:
        text:
    
    power_sensor:
      name: "Leistungs-Sensor"
      description: "Entity des Power/Leistungs-Sensors (z.B. sensor.waschmaschinesteckdose_energy_power)"
      selector:
        entity:
          domain: sensor
          device_class: power
    
    threshold_running:
      name: "Schwellwert: Läuft (Watt)"
      description: "Leistung über diesem Wert = Gerät läuft aktiv"
      default: 100
      selector:
        number:
          min: 1
          max: 5000
          unit_of_measurement: "W"
    
    threshold_finished:
      name: "Schwellwert: Fertig (Watt)"
      description: "Leistung zwischen Fertig und Aus. Unter diesem Wert = idle/fertig"
      default: 10
      selector:
        number:
          min: 1
          max: 500
          unit_of_measurement: "W"
    
    timer_delay_seconds:
      name: "Timer-Verzögerung (Sekunden)"
      description: "Wie lange muss Leistung unter Running-Schwellwert sein, bevor Status zu 'Fertig' wechselt? (Pausen berücksichtigen)"
      default: 300
      selector:
        number:
          min: 60
          max: 3600
          step: 60
          unit_of_measurement: "s"
    
    create_helpers:
      name: "Helper automatisch erstellen?"
      description: "Wenn aktiviert: Input Boolean + Template Sensor werden automatisch erstellt (Ansatz B). Wenn deaktiviert: du erstellst sie manuell."
      default: true
      selector:
        boolean:

trigger: []

condition: []

action:
  # ============================================================================
  # SETUP-Phase: Helper erstellen (nur beim ersten Import)
  # ============================================================================
  - alias: "Setup: Prüfe ob Input Boolean existiert"
    if:
      - condition: template
        value_template: "{{ create_helpers | bool }}"
    then:
      # Input Boolean erstellen
      - service: automation.create_or_update
        data:
          automation_id: "{{ device_name | replace(' ', '_') | lower }}_setup_input_boolean"
          alias: "{{ device_name }} - Setup: Input Boolean erstellen"
          trigger:
            - trigger: homeassistant
              event: start
          condition:
            - condition: template
              # Prüfe ob das Input Boolean noch nicht existiert
              value_template: "{{ state_attr('input_boolean.' + (device_name | replace(' ', '_') | lower) + '_timer_under_threshold', 'friendly_name') is none }}"
          action:
            - service: input_boolean.create
              data:
                name: "{{ device_name }} - Timer unter Schwellwert"
                icon: mdi:timer
                initial: false
    
    # Template Sensor erstellen
      - service: automation.create_or_update
        data:
          automation_id: "{{ device_name | replace(' ', '_') | lower }}_setup_template_sensor"
          alias: "{{ device_name }} - Setup: Template Sensor erstellen"
          trigger:
            - trigger: homeassistant
              event: start
          condition:
            - condition: template
              value_template: "{{ states('sensor.' + (device_name | replace(' ', '_') | lower) + '_status') == 'unknown' }}"
          action:
            - service: template.create_sensor
              data:
                name: "{{ device_name }} Status"
                unique_id: "{{ device_name | replace(' ', '_') | lower }}_status_sensor"
                unit_of_measurement: ""
                icon: mdi:power
                state: |
                  {%- set power = states('{{ power_sensor }}') | float(0) -%}
                  {%- set timer = states('input_boolean.' + ('{{ device_name }}' | replace(' ', '_') | lower) + '_timer_under_threshold') -%}
                  
                  {% if power > {{ threshold_running }} %}
                    Läuft
                  {% elif timer == 'on' %}
                    Fertig
                  {% else %}
                    Aus
                  {% endif %}

  # ============================================================================
  # UNIFIED AUTOMATION: Timer-Verwaltung (beide Trigger in einer Automation)
  # ============================================================================
  - alias: "{{ device_name }} - Timer Verwaltung"
    id: "{{ device_name | replace(' ', '_') | lower }}_timer_management"
    trigger:
      - trigger: numeric_state
        id: "power_below_threshold"
        entity_id: "{{ power_sensor }}"
        below: "{{ threshold_running }}"

      - trigger: numeric_state
        id: "power_above_threshold"
        entity_id: "{{ power_sensor }}"
        above: "{{ threshold_running }}"

    action:
      - choose:
          # Trigger 1: Power fällt unter Schwellwert → Timer starten
          - conditions:
              - condition: trigger
                id: "power_below_threshold"
              - condition: state
                entity_id: "input_boolean.{{ device_name | replace(' ', '_') | lower }}_timer_under_threshold"
                state: "off"
            sequence:
              - alias: "Timer starten (unter {{ threshold_running }}W)"
                service: input_boolean.turn_on
                target:
                  entity_id: "input_boolean.{{ device_name | replace(' ', '_') | lower }}_timer_under_threshold"

          # Trigger 2: Power steigt über Schwellwert → Timer zurücksetzen
          - conditions:
              - condition: trigger
                id: "power_above_threshold"
            sequence:
              - alias: "Timer zurücksetzen (über {{ threshold_running }}W)"
                service: input_boolean.turn_off
                target:
                  entity_id: "input_boolean.{{ device_name | replace(' ', '_') | lower }}_timer_under_threshold"
